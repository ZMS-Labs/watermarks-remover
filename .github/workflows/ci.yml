name: integrity

# Tier D (paused / straight fork): dispatch-only. No push or pull_request
# triggers by design -- see "Actions tier" in README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python3 -m pip install --upgrade pip pytest

      - name: Test
        run: python3 -m pytest -q
